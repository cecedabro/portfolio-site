# Served by nginx-unprivileged: listens on 8080, runs as uid 101.
# This file replaces /etc/nginx/conf.d/default.conf in the image.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    # Kubernetes liveness/readiness probe target.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints these filenames, so the content never changes
    # under a given URL — cache hard.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # HTML must revalidate every time so a new deploy is picked up at once.
    location ~ \.html$ {
        expires -1;
    }

    # Multi-page site, no SPA rewrite: serve the file, the directory index,
    # or an implicit .html, otherwise a real 404.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # The site loads only same-origin assets — keep it that way.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'" always;
}
